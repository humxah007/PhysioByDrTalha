<style>
:root{--bg:#F7F9FA;--sf:#fff;--ink:#14212B;--mute:#52626E;--pri:#0E5A66;--on:#fff;--acc:#1FA39A;--line:#E3E8EB;--bone:#2B3B46;--r:8px;
--hd:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;--bd:'Inter','Segoe UI',system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1417;--sf:#151D21;--ink:#E8EEF1;--mute:#9DAEB9;--pri:#5CC6CC;--on:#0A1316;--acc:#3CC4B8;--line:#26323A;--bone:#D6E2E7;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0E1417;--sf:#151D21;--ink:#E8EEF1;--mute:#9DAEB9;--pri:#5CC6CC;--on:#0A1316;--acc:#3CC4B8;--line:#26323A;--bone:#D6E2E7;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 clamp(16px,1.1vw + 12px,18px)/1.6 var(--bd);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--hd);font-weight:600;line-height:1.15;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(38px,5.6vw,60px);font-weight:700}h2{font-size:clamp(26px,3.4vw,38px)}h3{font-size:clamp(18px,1.8vw,21px)}
p{margin:0;max-width:66ch}a{color:var(--pri);text-underline-offset:3px}.mute{color:var(--mute)}
.ur{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif;direction:rtl;line-height:2.1;color:var(--mute)}
.w{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
section{padding:clamp(48px,7vw,88px) 0;border-top:1px solid var(--line)}section.f{border:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{font:700 18px var(--hd);color:var(--ink);text-decoration:none}
nav{display:flex;align-items:center;gap:28px}nav a{color:var(--ink);text-decoration:none;font-size:15px;font-weight:500}nav a:hover,nav a.on{color:var(--pri)}
.btn{display:inline-block;background:var(--pri);color:var(--on)!important;font:500 15px var(--bd);padding:12px 22px;border-radius:var(--r);text-decoration:none;border:0;cursor:pointer;transition:transform .18s ease-out,filter .18s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.45;cursor:default}
.tl{background:none;border:0;color:var(--pri);font:500 15px var(--bd);cursor:pointer;padding:12px 0;text-decoration:underline;text-underline-offset:3px}
#mb{display:none;background:none;border:0;color:var(--ink);font:500 15px var(--bd);padding:8px;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.in{animation:up .5s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center;padding:clamp(40px,7vw,88px) 0}
.hero .lead{margin-top:20px;color:var(--mute);font-size:1.1em}.hero .ur{font-size:1.1rem;margin-top:16px}
.acts{display:flex;gap:24px;align-items:center;margin-top:32px;flex-wrap:wrap}
.info div{padding:18px 0;border-top:1px solid var(--line)}.info div:first-child{border:0;padding-top:0}.info h3{font-size:15px;color:var(--mute);font-weight:500;margin-bottom:4px}.info strong{font:600 19px/1.3 var(--hd);display:block}
.cl{list-style:none;padding:0;margin:28px 0 0;columns:2;column-gap:56px}
.cl li{break-inside:avoid;border-bottom:1px solid var(--line);padding:16px 0}.cl a{text-decoration:none;color:var(--ink);display:block}.cl b{font:600 19px var(--hd);display:flex;justify-content:space-between;gap:12px}.cl a:hover b{color:var(--pri)}
.cl span{display:block;color:var(--mute);font-size:15px;margin-top:2px}.cl .ur{font:400 16px 'Noto Nastaliq Urdu',serif}
.sr{width:100%;max-width:520px;background:none;border:0;border-bottom:2px solid var(--line);color:var(--ink);font:400 18px var(--bd);padding:12px 0;margin-top:24px}.sr:focus{outline:0;border-color:var(--pri)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:36px}.st b{font:700 26px var(--hd);color:var(--pri)}.st h3{margin:6px 0}.st p{color:var(--mute);font-size:.95em}
.r3{grid-template-columns:repeat(3,1fr)}@media(max-width:820px){.r3{grid-template-columns:1fr!important}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.cv{width:100%;display:block;touch-action:pan-y;cursor:grab;height:clamp(420px,60vw,640px)}.cv:active{cursor:grabbing}
.ex{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start;margin-top:24px}
.pick{display:flex;flex-wrap:wrap;gap:6px 20px;margin:20px 0}.pick button{background:none;border:0;border-bottom:1px solid transparent;color:var(--mute);font:500 16px var(--bd);padding:4px 0;cursor:pointer}.pick button:hover,.pick button[aria-pressed=true]{color:var(--pri);border-color:var(--pri)}
.dl{margin-top:32px}.dl>div{padding:14px 0;border-top:1px solid var(--line)}.dl h3{font-size:16px;margin-bottom:4px}.dl p{max-width:70ch}
.art h2{margin:44px 0 14px;font-size:clamp(22px,2.6vw,28px)}.art .tx p{margin-bottom:6px}
.pg{margin:12px 0;padding-left:16px;border-left:3px solid var(--acc)}
fieldset{border:0;padding:0;margin:0}label{display:block;font-weight:500;font-size:15px;margin:22px 0 2px}
.fm input,.fm select,.fm textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--mute);color:var(--ink);font:400 17px var(--bd);padding:10px 0;border-radius:0}.fm input:focus,.fm select:focus,.fm textarea:focus{outline:0;border-color:var(--pri)}
.fm select option{background:var(--sf)}.fm input[type=range]{accent-color:var(--pri);border:0}.fm input[type=checkbox],.fm input[type=radio]{width:auto;accent-color:var(--pri)}
.slots{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:8px}.slots button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink);font:500 16px var(--bd);padding:6px 0;cursor:pointer}.slots button[aria-pressed=true]{color:var(--pri);border-color:var(--pri)}
.stp{display:flex;gap:28px;margin:28px 0 8px;color:var(--mute);font-size:15px}.stp .on{color:var(--pri);font-weight:500;border-bottom:2px solid var(--pri)}
.rv{padding:22px 0;border-top:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding:56px 0 40px;font-size:15px}footer .g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}footer h3{font-size:15px;margin-bottom:10px}footer a{display:block;color:var(--mute);text-decoration:none;padding:3px 0}footer a:hover{color:var(--pri)}.cp{margin-top:40px;color:var(--mute);font-size:14px}
#wa{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.18)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:820px){.hero,.ex,.two,footer .g{grid-template-columns:1fr;gap:32px}.st{grid-template-columns:1fr 1fr}.cl{columns:1}#mb{display:block}
nav{display:none;position:absolute;top:68px;left:0;right:0;background:var(--bg);flex-direction:column;align-items:flex-start;padding:20px;gap:16px;border-bottom:1px solid var(--line)}nav.o{display:flex}}
.tb{margin-top:8px}.tb button{background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:4px 12px;cursor:pointer;font:500 14px var(--bd)}.re{border-bottom:1px solid var(--mute);padding:10px 0;min-height:44px}.re:focus{outline:0;border-color:var(--pri)}.fm textarea{resize:vertical}

const D={'back-pain':{o:'Back pain refers to discomfort anywhere along the spine, most often in the lower back (lumbar region). It can be mechanical (from muscles, joints, discs, or ligaments) or, less commonly, referred from internal organs or nerve compression.',
v:[['Acute','Less than 6 weeks — often resolves with conservative care.'],['Subacute','6–12 weeks duration.'],['Chronic','More than 12 weeks — needs a structured rehabilitation program.'],['Mechanical vs Radicular','Mechanical: localized to the back. Radicular: pain radiates down the leg due to nerve root irritation (see Sciatica).']],
p:'Repetitive strain, poor posture, or sudden load can irritate the small facet joints, strain paraspinal muscles, or stress the intervertebral discs. Prolonged sitting and weak core musculature increase load on the lumbar spine, perpetuating pain and muscle guarding.',
g:'The vast majority of back pain is non-specific and not dangerous — over 90% of acute episodes improve within 6 weeks with appropriate activity and physiotherapy. A minority (with red-flag signs such as unexplained weight loss, fever, or bowel/bladder changes) require urgent medical evaluation to rule out serious pathology.',
t:['Reserved for a small percentage of cases with confirmed disc herniation causing nerve compression, spinal instability, or failure of 6+ months of conservative treatment.','Core stabilization exercises, manual therapy, McKenzie-method directional exercises, and posture/ergonomic correction — first-line treatment per most clinical guidelines.','TENS and IFT for pain modulation, ultrasound therapy for muscle relaxation, and lumbar traction for disc-related pain.']},
'neck-pain':{o:'Neck pain (cervicalgia) arises from the muscles, joints, or discs of the cervical spine, commonly linked to poor posture (especially prolonged phone/screen use — “tech neck”), whiplash injury, or age-related degeneration.',
v:[['Postural/Mechanical','From sustained poor posture and muscle imbalance — most common type.'],['Whiplash-Associated Disorder','Sudden acceleration-deceleration injury, e.g. road traffic accidents.'],['Cervical Spondylosis','Age-related degeneration of cervical discs and joints — graded mild to severe by imaging.'],['Cervical Radiculopathy','Nerve root compression causing pain/numbness radiating into the arm.']],
p:'Sustained forward head posture increases load on cervical muscles and joints several-fold, leading to muscle fatigue, joint stiffness, and, over years, disc and joint degeneration (spondylosis) that can narrow the space around nerve roots.',
g:'The large majority of neck pain is mechanical and resolves well with physiotherapy and posture correction. Neck pain with arm weakness, numbness, or signs after significant trauma should be assessed promptly to rule out nerve or spinal cord involvement.',
t:['Considered only for confirmed nerve/spinal cord compression with progressive neurological deficit unresponsive to conservative care.','Postural retraining, deep neck flexor strengthening, manual therapy/mobilization, and ergonomic workstation advice.','TENS and IFT for pain relief, cervical traction for radicular symptoms, and ultrasound for muscular tension.']},
'arthritis':{o:'Arthritis is an umbrella term for more than 100 conditions that cause inflammation and damage to one or more joints. The two most common forms are osteoarthritis (OA), caused by wear-and-tear breakdown of joint cartilage, and rheumatoid arthritis (RA), an autoimmune disease in which the immune system attacks the joint lining (synovium).',v:[['Osteoarthritis (OA)','Degenerative — cartilage wears down gradually, usually in knees, hips, hands and spine.'],['Rheumatoid Arthritis (RA)','Autoimmune and symmetrical — commonly affects small joints of hands and feet first.'],['Gouty Arthritis','Caused by uric acid crystal deposits; covered separately under Gout.'],['Stages of OA (Kellgren-Lawrence)','Grade 1: minimal — Grade 2: mild joint space narrowing — Grade 3: moderate, visible cartilage loss — Grade 4: severe, bone-on-bone.']],p:'In osteoarthritis, cartilage — the smooth cushion between bones — thins and roughens, so bones move with more friction, triggering bone spurs (osteophytes) and low-grade inflammation. In rheumatoid arthritis, immune cells infiltrate the synovium, releasing inflammatory chemicals that erode cartilage and bone if untreated.',g:'Arthritis is not life-threatening but is a leading cause of long-term disability if left untreated. Early physiotherapy and joint protection significantly slow progression and preserve independence; RA requires medical (rheumatology) management alongside physiotherapy to control the underlying immune process.',t:['Joint replacement (e.g. total knee/hip arthroplasty) or arthroscopic debridement, reserved for advanced (Grade 3–4) cases where conservative care has failed.','Range-of-motion and low-impact strengthening exercises, joint mobilization, gait and posture correction, and activity pacing to protect joints while maintaining function.','TENS for pain relief, therapeutic ultrasound to reduce stiffness, and interferential current (IFT) for deeper joint inflammation, available at Gulzar Medical Complex.']},
'paralysis':{h:'Underlying cause can be serious — seek prompt assessment',o:'Paralysis is the loss of the ability to move some or all of the body, most commonly resulting from a stroke, spinal cord injury, or peripheral nerve damage. It may be partial (paresis) or complete, and can affect one limb (monoplegia), one side of the body (hemiplegia), both legs (paraplegia), or all four limbs (quadriplegia/tetraplegia).',v:[['Hemiplegia','One side of the body — the most common pattern after stroke.'],['Paraplegia','Both legs affected — typically from spinal cord injury below the neck.'],['Quadriplegia / Tetraplegia','All four limbs affected — spinal cord injury at neck level.'],['Flaccid vs Spastic','Flaccid: floppy, reduced tone (early stage). Spastic: stiff, increased tone (later/chronic stage).']],p:'Paralysis occurs when the signal pathway between the brain and muscles is disrupted — either at the brain (stroke, traumatic brain injury), spinal cord (injury, compression), or peripheral nerve level. Without nerve signals, muscles lose voluntary control and, over time, can atrophy (shrink) and develop contractures if not actively mobilized.',g:'The underlying cause (e.g. stroke, spinal injury) can be life-threatening in its acute phase and requires emergency medical care first. Once medically stable, paralysis itself is a manageable, rehabilitation-focused condition — many patients regain significant function with early, intensive, and consistent physiotherapy, especially within the first 3–6 months.',t:['Addresses the underlying cause where applicable (e.g. spinal decompression surgery, tendon transfer surgery for contractures) — physiotherapy is required both before and after.','Task-specific repetitive movement training, gait re-education, balance training, and stretching to prevent contractures — proven to drive neuroplastic recovery in stroke rehabilitation.','Neuromuscular electrical stimulation (NMES) to re-activate weak muscles, functional electrical stimulation (FES) for gait training, and TENS for associated pain.']},
'disc-herniation':{o:'Each vertebra is cushioned by an intervertebral disc with a tough outer ring (annulus fibrosus) and a soft gel center (nucleus pulposus). A herniated (slipped) disc occurs when the gel center pushes through a tear in the outer ring, which can press on nearby spinal nerves.',v:[['Bulging Disc','Disc extends slightly beyond its normal boundary without a tear — mildest form.'],['Protrusion','The nucleus pushes against a thinned annulus without fully rupturing it.'],['Extrusion','The nucleus breaks through the annulus but stays connected.'],['Sequestration','A fragment fully separates from the disc — most severe, sometimes needs surgery.']],p:'With age, discs naturally lose water content and become less flexible, making the annulus more prone to tearing under load (heavy lifting, twisting). When herniated material contacts a spinal nerve root, it causes local inflammation and mechanical compression, producing pain, numbness, or weakness along that nerve’s path.',g:'Not life-threatening. Studies show a large proportion of herniated discs shrink or resolve on imaging over 6–12 months as the body reabsorbs the herniated material, and most patients improve with conservative treatment alone. Cauda equina syndrome (loss of bladder/bowel control, saddle numbness) is a rare surgical emergency requiring immediate hospital care.',t:['Microdiscectomy considered when there is progressive neurological weakness, cauda equina syndrome, or persistent disabling pain after 6–8 weeks of appropriate physiotherapy.','Directional preference (McKenzie) exercises, nerve gliding/flossing techniques, core stabilization, and gradual return-to-activity programs.','Spinal traction to reduce disc pressure, TENS for radicular pain, and ultrasound for surrounding muscle spasm.']},
'knee-pain':{o:'Knee pain can originate from bone, cartilage, ligaments (ACL, PCL, MCL, LCL), tendons (patellar tendon), or the menisci, and is one of the most common musculoskeletal complaints across all ages.',v:[['Ligament Sprain','ACL/MCL injuries, graded I (mild) to III (complete tear).'],['Meniscus Tear','Cartilage cushion tear, often from twisting injuries.'],['Patellofemoral Pain Syndrome','Pain around/behind the kneecap from tracking or overuse issues.'],['Osteoarthritis of the Knee','Progressive cartilage wear — see Arthritis staging.']],p:'The knee relies on precise coordination between the quadriceps, hamstrings, and ligaments to stay stable under load. Weakness or imbalance in these muscles alters joint mechanics, increasing stress on cartilage and ligaments and accelerating wear or injury risk.',g:'Most knee pain is manageable with physiotherapy, and even significant ligament or meniscus injuries often heal well with structured rehabilitation. A locked knee, inability to bear weight, or major trauma warrants urgent orthopedic assessment.',t:['ACL reconstruction, meniscus repair, or knee replacement for advanced arthritis — physiotherapy is essential both pre- and post-operatively for a full recovery.','Quadriceps and hamstring strengthening, balance/proprioception training, and gradual return-to-sport or activity protocols.','NMES to activate the quadriceps after injury/surgery, ultrasound for swelling, and TENS for pain control.']},
'sciatica':{o:'Sciatica is pain that radiates along the path of the sciatic nerve — from the lower back through the hip and buttock and down each leg — typically caused by compression or irritation of one of the lumbar nerve roots (most often from a herniated disc).',v:[['Acute Sciatica','Sudden onset, often after lifting or twisting — usually improves within weeks.'],['Chronic Sciatica','Persistent symptoms beyond 8–12 weeks.'],['Piriformis Syndrome','Sciatic nerve irritated by the piriformis muscle rather than the spine — a common mimic.']],p:'When a herniated disc, bone spur, or tight piriformis muscle presses on the sciatic nerve root, it disrupts normal nerve conduction and triggers local inflammation, producing sharp, shooting, or burning pain, tingling, or numbness anywhere along the nerve’s path down the leg.',g:'Sciatica is very rarely dangerous — most cases improve within 4–6 weeks with conservative treatment. Progressive leg weakness, or loss of bladder/bowel control (cauda equina syndrome), are red flags requiring emergency care.',t:['Microdiscectomy considered only if severe leg weakness develops or pain remains disabling after 6+ weeks of thorough conservative treatment.','Nerve gliding exercises, McKenzie extension exercises, core stabilization, and activity modification to reduce nerve irritation.','Lumbar traction, TENS for nerve pain, and IFT for deep-seated inflammation around the nerve root.']},
'frozen-shoulder':{o:'Frozen shoulder (adhesive capsulitis) is a condition in which the connective tissue capsule surrounding the shoulder joint thickens and tightens, causing progressive pain and a marked loss of both active and passive range of motion.',v:[['Stage 1: Freezing','Gradual onset of pain with progressively worsening stiffness — lasts 6 weeks to 9 months.'],['Stage 2: Frozen','Pain may reduce but stiffness peaks, significantly limiting movement — lasts 4–12 months.'],['Stage 3: Thawing','Gradual, spontaneous return of motion over 6 months to 2 years.']],p:'Chronic low-grade inflammation causes the normally loose shoulder joint capsule to thicken and form adhesions (scar-like bands), physically restricting the joint’s ability to move — distinct from simple rotator cuff pain, which does not restrict passive movement.',g:'Not dangerous, but can be a slow-resolving condition — the natural course can take 1–3 years without treatment. Structured physiotherapy shortens this timeline substantially and preserves function in the meantime, so early intervention is strongly advised.',t:['Manipulation under anesthesia or arthroscopic capsular release considered for cases that fail to improve after 6+ months of dedicated physiotherapy.','Gentle passive and active-assisted range-of-motion exercises, joint mobilization techniques, and a home stretching program progressed according to the current stage.','Ultrasound and moist heat to improve tissue extensibility before stretching, and TENS for pain relief during mobilization.']},
'plantar-fasciitis':{o:'Plantar fasciitis is inflammation and micro-tearing of the plantar fascia — the thick band of tissue connecting the heel bone to the toes — causing classic stabbing heel pain, worst with the first steps in the morning.',v:[['Acute','Recent onset, typically under 6 weeks, often linked to a sudden increase in activity or new footwear.'],['Chronic','Symptoms beyond 6 months, sometimes with degenerative changes (fasciosis) rather than pure inflammation.'],['With Heel Spur','A bony growth may be present on imaging but is often incidental, not the pain’s true source.']],p:'Repetitive tension on the plantar fascia — from prolonged standing, obesity, tight calf muscles, or unsupportive footwear — causes small tears at its attachment to the heel bone. If irritation continues without adequate rest and loading management, degenerative changes can develop.',g:'Not serious, and roughly 80–90% of cases resolve within 6–12 months with conservative treatment such as stretching, taping, and appropriate footwear, without need for surgery.',t:['Plantar fascia release surgery is a last resort for the small minority of cases unresponsive to 6–12 months of thorough conservative treatment.','Calf and plantar fascia stretching, intrinsic foot muscle strengthening, taping techniques, and footwear/orthotic advice.','Therapeutic ultrasound and low-level laser therapy to support tissue healing, plus shockwave-style modalities for chronic cases.']},
'gout':{o:'Gout is a type of inflammatory arthritis caused by a build-up of uric acid crystals inside a joint, most classically the big toe, causing sudden, severe pain, redness, and swelling (a “gout attack” or flare).',v:[['Acute Gout Flare','Sudden, intense joint pain lasting days to weeks.'],['Intercritical Gout','Symptom-free period between flares — crystals may still be silently present.'],['Chronic Tophaceous Gout','Long-standing untreated gout with visible uric acid deposits (tophi) under the skin.']],p:'When blood uric acid levels stay high (hyperuricemia), needle-shaped urate crystals form inside the joint space. The immune system reacts to these crystals as foreign material, triggering an intense inflammatory response responsible for the classic redness, heat, and severe pain.',g:'Not life-threatening, but recurrent, poorly controlled gout can permanently damage joints and is associated with kidney stones and cardiovascular risk, so it requires medical management of uric acid levels alongside physiotherapy for joint function.',t:['Rarely needed — occasionally to remove large tophi or address severe joint damage in long-standing untreated cases.','Gentle range-of-motion exercises once the acute flare settles, joint protection advice, and gait aids during flare-ups to offload the affected joint.','Cold therapy/cryotherapy during acute flares, and low-level laser or ultrasound between flares to support joint recovery.']},
'muscle-pain':{o:'Muscle pain (myalgia) is discomfort within a muscle or muscle group, ranging from a mild ache after exercise (DOMS) to persistent pain from muscle strain, tension, or trigger points (myofascial pain syndrome).',v:[['Acute Strain','Sudden overstretching or tearing of muscle fibers, Grade I–III by severity.'],['Delayed Onset Muscle Soreness (DOMS)','Normal, temporary soreness 24–72 hours after unfamiliar exercise.'],['Myofascial Pain Syndrome','Chronic pain from hyperirritable “trigger points” within tight muscle bands.'],['Chronic Overuse Myalgia','Repetitive strain from work or sport without adequate recovery.']],p:'Muscle fibers experience micro-tears or sustained contraction that restricts local blood flow, causing a buildup of inflammatory byproducts that sensitize local nerve endings. Trigger points form when a section of muscle stays in sustained contraction, creating a taut, tender band.',g:'Generally not serious and resolves with rest, gradual loading, and physiotherapy within days to a few weeks. Persistent, unexplained muscle pain with weakness or dark urine should be medically evaluated to rule out rare conditions like rhabdomyolysis or inflammatory myopathy.',t:['Rarely required — only for complete (Grade III) muscle/tendon ruptures needing surgical repair.','Gentle stretching, progressive loading exercises, myofascial release, and trigger-point manual therapy.','Ultrasound and IFT to reduce muscle spasm, and TENS for pain relief during the acute phase.']},
'bells-palsy':{o:'Bell’s palsy is a sudden, usually temporary weakness or paralysis of the muscles on one side of the face, caused by dysfunction of the facial nerve (cranial nerve VII), often following a viral infection that causes nerve swelling within its bony canal.',v:[['Mild (House-Brackmann Grade I–II)','Slight weakness, most facial function preserved.'],['Moderate (Grade III–IV)','Noticeable asymmetry, incomplete eye closure.'],['Severe (Grade V–VI)','Barely perceptible to no facial movement on the affected side.']],p:'Inflammation causes the facial nerve to swell within the narrow bony canal (facial canal) it passes through in the skull, compressing the nerve and disrupting the electrical signals that control facial muscles — leading to drooping of the mouth, inability to close the eye, and loss of forehead wrinkling on the affected side.',g:'The large majority of patients (around 70%) recover fully within 3–6 months, especially when medical treatment (steroids) is started early and physiotherapy is combined with eye protection. Sudden facial weakness should always first be assessed by a doctor to rule out stroke, which requires emergency care.',t:['Very rarely required — occasionally considered for permanent, severe cases via nerve grafting or static procedures years after onset.','Facial neuromuscular re-education exercises, mirror biofeedback therapy, and gentle facial massage — with caution to avoid overly forceful stimulation, which can worsen synkinesis (unwanted associated movements).','Low-intensity electrical stimulation is used cautiously and only in select cases, alongside heat therapy to improve local circulation.']},
'physical-rehabilitation':{o:'Physical rehabilitation is a broad, goal-directed physiotherapy program designed to restore movement, strength, and independence after surgery, illness, prolonged bed rest, or major injury — tailored to each patient’s starting point and functional goals.',v:[['Orthopedic Rehab','After fractures, joint replacements, or ligament surgery.'],['Neurological Rehab','After stroke, spinal cord injury, or nerve damage.'],['Cardiopulmonary Rehab','After cardiac events or for chronic lung conditions.'],['Geriatric Rehab','Focused on restoring safe mobility and preventing falls in older adults.']],p:'Extended immobility causes rapid muscle atrophy (as much as 1–1.5% strength loss per day of bed rest), joint stiffness, and reduced cardiovascular fitness. Structured, progressive loading reverses this through the body’s normal adaptation response to graded physical stress.',g:'Rehabilitation outcomes are generally very good when started early and followed consistently; delay in starting rehab after illness/surgery is one of the strongest predictors of poorer long-term function, making early physiotherapy referral important.',t:['Not applicable directly — rehabilitation is typically the follow-on care after a surgical procedure has already been performed elsewhere.','Individualized graded exercise programs, functional mobility training (transfers, walking, stairs), and strength/endurance rebuilding.','NMES to counter muscle atrophy, and other modalities selected based on the specific underlying condition being rehabilitated.']},
'fracture-rehab':{o:'Fracture rehabilitation is the structured physiotherapy process that follows cast removal or fracture surgery, aimed at restoring joint range of motion, muscle strength, and function that is lost during the immobilization period.',v:[['Immediate Post-Immobilization','First 1–2 weeks after cast/splint removal — very gentle, protected movement.'],['Early Mobilization Phase','Progressive range-of-motion work, weeks 2–6.'],['Strengthening Phase','Progressive resistance exercise once healing is confirmed, typically 6+ weeks onward.'],['Functional/Return-to-Activity Phase','Task-specific training to return to work, sport, or daily activities.']],p:'Bone healing (union) occurs in overlapping stages — inflammation, soft callus formation, hard callus formation, and remodeling — typically taking 6–12 weeks depending on the bone and the patient’s age. Meanwhile, the immobilized joint and surrounding muscle lose range and strength, which must be rebuilt once the bone is stable enough to tolerate movement.',g:'Excellent with appropriate, correctly timed physiotherapy. Restarting movement too early (before bony union) or too late (leaving the joint immobile too long) both worsen outcomes, which is why physiotherapy timing is coordinated with the treating orthopedic surgeon’s guidance.',t:['Refers to the original fracture fixation (plates, screws, or casting) performed by an orthopedic surgeon; physiotherapy begins once medically cleared.','Range-chair and assisted range-of-motion exercises, progressive resistance training, scar/soft-tissue mobilization, and gait training with appropriate weight-bearing precautions.','NMES to prevent/reverse disuse muscle atrophy, ultrasound to support soft tissue healing, and TENS for post-fracture pain.']},
'neuropathy':{o:'Peripheral neuropathy is damage or dysfunction of the nerves outside the brain and spinal cord, most commonly affecting the hands and feet with symptoms of numbness, tingling (“pins and needles”), burning pain, or weakness. Diabetes is the leading cause worldwide.',v:[['Diabetic Peripheral Neuropathy','Most common cause — a slow, symmetric “stocking-glove” pattern of numbness.'],['Compression Neuropathy','e.g. Carpal Tunnel Syndrome — a single nerve compressed at a specific site.'],['Post-Traumatic Neuropathy','Following direct nerve injury from trauma or surgery.'],['Idiopathic/Other','Nutritional deficiency, certain medications, or unknown cause.']],p:'High blood sugar (in diabetes) damages the small blood vessels that supply peripheral nerves, starving them of oxygen and nutrients over time, while direct compression (as in carpal tunnel syndrome) mechanically restricts nerve blood flow and signal conduction at a specific point.',g:'Neuropathy itself is not life-threatening, but sensory loss increases the risk of unnoticed injuries (especially diabetic foot ulcers), so early physiotherapy, protective footwear, and strict blood sugar control (where diabetic) are important to prevent complications.',t:['Carpal tunnel release or other nerve decompression surgery for confirmed, severe single-nerve compression unresponsive to conservative treatment.','Nerve gliding exercises, balance and proprioception training (crucial for fall prevention), and sensory re-education techniques.','TENS for neuropathic pain relief and electrical stimulation to help maintain muscle activity in affected limbs.']},
'polio':{o:'Poliomyelitis is a viral infection that can permanently damage motor neurons in the spinal cord, causing asymmetric muscle weakness or paralysis, most often in the legs. While new infections are now rare due to vaccination, physiotherapy remains essential for people living with post-polio effects.',v:[['Acute Paralytic Polio','The active infection phase causing initial muscle weakness.'],['Residual Paralysis','Permanent weakness remaining after recovery from the acute infection.'],['Post-Polio Syndrome (PPS)','New muscle weakness and fatigue appearing decades after the original infection, in previously stable muscles.']],p:'The poliovirus selectively destroys motor neurons in the spinal cord’s anterior horn, permanently reducing the number of nerve cells available to activate a given muscle. Surviving neurons compensate by branching out to control extra muscle fibers, but this compensation can break down decades later, causing the new weakness seen in post-polio syndrome.',g:'Not dangerous once past the acute infection phase, but is a lifelong condition requiring adapted movement strategies. Post-polio syndrome, in particular, requires careful, non-fatiguing exercise dosing under physiotherapy guidance rather than aggressive strengthening.',t:['Tendon transfer or corrective orthopedic surgery may be considered for severe joint deformities from long-standing muscle imbalance.','Individually dosed strengthening (avoiding overwork weakness), gait training with orthotic/brace support, and energy conservation strategies, especially important in post-polio syndrome.','Gentle NMES to maintain muscle activation in select cases, and hydrotherapy-style low-resistance exercise where available.']},
'dry-needling':{o:'Dry needling is a physiotherapy technique in which a thin, sterile, single-use needle is inserted directly into a myofascial trigger point — a tight, irritable band within a muscle — to release tension and reduce pain. It is a Western biomedical technique distinct from acupuncture, though both use similar needles.',v:[['Superficial Dry Needling','Needle inserted just under the skin over the trigger point.'],['Deep Dry Needling','Needle advanced directly into the trigger point within the muscle belly.'],['Used For','Chronic neck/back pain, tension headaches, frozen shoulder, tennis elbow, and sports-related muscle tightness.']],p:'Trigger points are believed to form from sustained muscle contraction that restricts local blood flow. Inserting a needle directly into the point elicits a brief “twitch response,” which is thought to disrupt the abnormal contraction cycle, restore local blood flow, and reduce the chemical irritants that sensitize pain nerves.',g:'A very low-risk procedure when performed by a trained physiotherapist with sterile technique; mild soreness for 24–48 hours afterward is normal and expected. It is used as one component of a broader treatment plan, not a standalone cure.',t:['Not applicable — dry needling itself is a minimally invasive physiotherapy technique, not a surgical procedure.','Combined with stretching, postural correction, and strengthening exercises after needling to maintain the release achieved and address the underlying cause of the tightness.','Sometimes combined with mild electrical stimulation through the needles (electro-dry-needling) for enhanced effect on stubborn trigger points.']},
'muscle-weakness':{o:'General muscle weakness refers to a reduced ability to generate normal muscle force, which can result from prolonged inactivity, aging (sarcopenia), illness, nutritional deficiency, or as a lingering effect after another condition (e.g. post-fracture, post-viral illness).',v:[['Disuse Weakness','From inactivity, bed rest, or immobilization — the most reversible type.'],['Sarcopenia','Age-related, progressive loss of muscle mass and strength.'],['Weakness Secondary to Illness','Following prolonged hospitalization, infection, or chronic disease.'],['Neurogenic Weakness','From nerve-related causes — see Paralysis/Neuropathy for these specific conditions.']],p:'Muscle tissue follows a strict “use it or lose it” principle — without regular loading, muscle fibers reduce in size (atrophy) and the nervous system becomes less efficient at recruiting them, both of which reduce measurable strength, often surprisingly quickly during illness or bed rest.',g:'Highly responsive to structured, progressive resistance exercise at any age, including in older adults — this is one of the best-supported interventions in physiotherapy for both preventing and reversing weakness-related disability.',t:['Not applicable, unless weakness stems from a separate surgically correctable cause identified during assessment.','Progressive resistance training tailored to current strength level, functional strengthening (sit-to-stand, stair climbing), and balance work to translate strength gains into safer daily movement.','NMES as an adjunct for patients unable to generate a strong voluntary contraction, alongside active exercise as tolerance improves.']},
'cerebral-palsy':{o:'Cerebral palsy (CP) is a group of permanent movement and posture disorders caused by non-progressive damage to the developing brain, usually occurring before, during, or shortly after birth. It is the most common childhood physical disability, and severity ranges widely between children.',v:[['Spastic CP','Most common type — stiff, tight muscles that resist movement.'],['Dyskinetic CP','Involuntary, uncontrolled movements that fluctuate in tone.'],['Ataxic CP','Affects balance and coordination, with shaky or unsteady movement.'],['GMFCS Levels I–V','A standard classification from Level I (walks with minimal limitation) to Level V (requires full physical assistance for mobility).']],p:'The brain injury itself does not worsen over time (it is “non-progressive”), but its effects on muscle tone, coordination, and growing bones/joints can change and sometimes worsen as a child grows if not actively managed — for example, persistently tight muscles can lead to joint contractures or hip displacement over years.',g:'Not life-threatening, and life expectancy for most children with CP is normal to near-normal, especially with good general health care. Early, consistent physiotherapy from infancy significantly improves long-term mobility, independence, and prevents secondary complications like contractures.',t:['Selective procedures (e.g. tendon lengthening, selective dorsal rhizotomy for severe spasticity) considered in specific cases alongside, not instead of, ongoing physiotherapy.','Developmental milestone-focused therapy, stretching to prevent contractures, gait training, and family-guided home exercise programs — most effective when started as early as possible.','NMES and gentle modalities selected carefully for pediatric use, focused on supporting active movement rather than passive stimulation alone.']}};

  it.forEach(i=>{x.globalAlpha=Math.max(.3,Math.min(1,.7+i[0]/70));if(!i[1]){x.strokeStyle=bone;x.lineWidth=i[4]*(i[2][3]+i[3][3])/2;x.beginPath();x.moveTo(i[2][0],i[2][1]);x.lineTo(i[3][0],i[3][1]);x.stroke()}else{x.fillStyle=bone;x.beginPath();x.arc(i[2][0],i[2][1],i[4]*i[2][3],0,7);x.fill()}});
  x.globalAlpha=1;H.forEach((h,n)=>{const a=pr(h[1]),on=n==st.hv||n==st.sel,r=(on?11:8)+(RM?0:Math.sin(t/400+n)*1.5);x.beginPath();x.arc(a[0],a[1],r,0,7);x.lineWidth=2;x.strokeStyle=acc;x.stroke();
   if(on){x.fillStyle=acc;x.globalAlpha=.35;x.fill();x.globalAlpha=1;x.fillStyle=cs.getPropertyValue('--ink');x.font='500 13px Inter,system-ui,sans-serif';x.fillText(h[0],a[0]+16,a[1]+4)}})}
 function loop(t){if(!cv.isConnected)return;if(st.vis){if(!st.dr){if(!st.touched&&!RM)st.ty=Math.sin(t/2600)*.7-.1;st.ay+=(st.ty-st.ay)*(RM?1:.07)}draw(t)}requestAnimationFrame(loop)}
